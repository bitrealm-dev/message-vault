# Release — production-shaped image built from this checkout.
# No live editing; rebuild after code changes. Closer to what you ship.
#
#   docker compose -f compose-release.yml up --build
#
# Personal vault: VAULT_MODE=personal docker compose -f compose-release.yml up --build
# Staging drop: copy JSONL into ./staging (mounted at /app/staging).

services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile.release
      args:
        NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-}
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:8080:8080"
    environment:
      VAULT_MODE: ${VAULT_MODE:-demo}
      VAULT_AUTH: ${VAULT_AUTH:-local}
      HANKO_API_URL: ${HANKO_API_URL:-${NEXT_PUBLIC_HANKO_API_URL:-}}
      NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-}
    volumes:
      - vault-data:/app/data
      - ./staging:/app/staging
    networks:
      default:
        aliases:
          - vault-backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - vault
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/cloudflare/bitrealm.dev.pem:/etc/nginx/certs/bitrealm.dev.pem:ro
      - /etc/ssl/cloudflare/bitrealm.dev.key:/etc/nginx/certs/bitrealm.dev.key:ro
    restart: unless-stopped

volumes:
  vault-data:
