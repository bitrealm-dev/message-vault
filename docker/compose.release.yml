# Release — production-shaped image built from this checkout.
# No live editing; rebuild after code changes. Closer to what you ship.
#
# From the repository root:
#   docker compose -f docker/compose.release.yml up --build
#
# docker/Dockerfile builds the Vite SPA in its own stage — no host build needed.
#
# Blank vault (no demo seed): DEMO_DATA=false docker compose -f docker/compose.release.yml up --build
# Guest pool (hosted Try it): GUEST_DEMO_POOL=true docker compose -f docker/compose.release.yml up --build
# Default is false so local compose still uses the shared demo user.
# Staging drop: copy JSONL into ./staging (mounted at /app/staging).
#
# VPS Hub + nginx TLS: private message-vault-ops repo (compose-hub.yml).

name: message-vault

services:
  vault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      DEMO_DATA: ${DEMO_DATA:-true}
      VAULT_AUTH: ${VAULT_AUTH:-local}
      GUEST_DEMO_POOL: ${GUEST_DEMO_POOL:-false}
    volumes:
      - vault-data:/app/data
      - ../staging:/app/staging

volumes:
  vault-data:
