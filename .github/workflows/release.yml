# Manually cut a semantic-versioned GitHub Release with platform archives
# (Linux .tgz, Windows/macOS .zip).
# Does not run on push/PR — only via Actions → Release → Run workflow.
#
# Version comes from crates/message-vault-io-gui/Cargo.toml (single source of truth;
# also shown in the GUI title via CARGO_PKG_VERSION). Bump that field before releasing.
#
# Optional signing (no-op until the matching repo secrets are set):
#   Windows: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGNING_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID,
#            NOTARY_APP_SPECIFIC_PASSWORD
# See docs/maintainers/signing.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: semver
        run: |
          set -euo pipefail
          V="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/message-vault-io-gui/Cargo.toml | head -n1)"
          if [[ -z "$V" ]]; then
            echo "version not found in crates/message-vault-io-gui/Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version from Cargo.toml: ${V@Q} (expected e.g. 0.4.0)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Will release tag v$V (from crates/message-vault-io-gui/Cargo.toml)"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: x86_64-unknown-linux-gnu
            archive_ext: ".tgz"
            ext: ""
          - os: windows-latest
            artifact_suffix: x86_64-pc-windows-msvc
            archive_ext: ".zip"
            ext: ".exe"
          - os: macos-latest
            artifact_suffix: aarch64-apple-darwin
            archive_ext: ".zip"
            ext: ""
    runs-on: ${{ matrix.os }}
    # Job-level env so `if:` can detect whether signing secrets are configured
    # (secrets cannot be referenced directly in step `if` expressions).
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libfontconfig1-dev \
            libxkbcommon-x11-0 libxkbcommon0 \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --workspace --release
          cargo build --release -p message-reexport --bin message-reexporter
          cargo build --release -p vault-push --features cli

      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$(mktemp --suffix=.pfx)"
          cleanup() { rm -f "$CERT_PATH"; }
          trap cleanup EXIT
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          SIGNTOOL=""
          for candidate in \
            "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe \
            "/c/Program Files/Windows Kits/10/bin/"*/x64/signtool.exe
          do
            if [[ -f "$candidate" ]]; then
              SIGNTOOL="$candidate"
              break
            fi
          done
          if [[ -z "$SIGNTOOL" ]]; then
            echo "signtool.exe not found in Windows Kits" >&2
            exit 1
          fi
          echo "Using $SIGNTOOL"

          # Sign project binaries that ship in the ZIP (GUI + cli/).
          for bin in \
            message-vault-io \
            go-sms-pro-exporter \
            sms-backup-restore-exporter \
            sms-backup-plus-exporter \
            openextract-exporter \
            imazing-exporter \
            imessage-ir-exporter \
            whatsapp-exporter \
            message-reexporter \
            vault-push
          do
            path="target/release/${bin}.exe"
            if [[ ! -f "$path" ]]; then
              echo "missing binary to sign: $path" >&2
              exit 1
            fi
            "$SIGNTOOL" sign \
              /f "$CERT_PATH" \
              /p "$WINDOWS_CERTIFICATE_PASSWORD" \
              /fd SHA256 \
              /tr http://timestamp.digicert.com \
              /td SHA256 \
              "$path"
          done

      - name: Sign and notarize macOS binaries
        if: matrix.os == 'macos-latest' && env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/message-vault-io-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$CERT_PATH"
          }
          trap cleanup EXIT

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          for bin in \
            message-vault-io \
            go-sms-pro-exporter \
            sms-backup-restore-exporter \
            sms-backup-plus-exporter \
            openextract-exporter \
            imazing-exporter \
            imessage-ir-exporter \
            whatsapp-exporter \
            message-reexporter \
            vault-push
          do
            path="target/release/${bin}"
            if [[ ! -f "$path" ]]; then
              echo "missing binary to sign: $path" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$path"
            codesign --verify --verbose "$path"
          done

          # Notarize the GUI (standalone Mach-O; stapling is not available without a
          # .app / .pkg / .dmg — Gatekeeper still checks online on first launch).
          NOTARY_ZIP="$RUNNER_TEMP/message-vault-io-notarize.zip"
          ditto -c -k --keepParent target/release/message-vault-io "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_SPECIFIC_PASSWORD" \
            --wait
          rm -f "$NOTARY_ZIP"

      - name: Package platform ZIP
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          scripts/package-release.sh \
            '${{ needs.validate.outputs.version }}' \
            '${{ matrix.artifact_suffix }}' \
            '${{ matrix.ext }}'

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.artifact_suffix }}
          path: dist/message-vault-io-${{ needs.validate.outputs.version }}-${{ matrix.artifact_suffix }}${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: package-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tgz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release archives found under dist/" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "Message Vault ${VERSION}" \
            --notes "## Highlights

          - Vault push posts message-ir JSONL as-is (batched multi-conversation bodies supported)
          - Contacts CSV branding clarified as vCard CSV
          - \`export.ini\` is written mode \`0600\` and Vault tab fields persist on exit
          - Same archive layout: GUI at root, \`lib/\`, \`cli/\`, \`licenses/\`

          ## Upgrade notes

          - Drop-in for 0.4.x users: same folder layout; replace the previous extract
          - Extract the whole archive and keep folders together (\`lib/\` and \`cli/\` must stay next to the app)

          ## Archives

          - \`message-vault-io-${VERSION}-x86_64-unknown-linux-gnu.tgz\`
          - \`message-vault-io-${VERSION}-x86_64-pc-windows-msvc.zip\`
          - \`message-vault-io-${VERSION}-aarch64-apple-darwin.zip\`

          ## Layout

          - **Root:** \`message-vault-io\` (GUI; exporters run as libraries)
          - **\`lib/\`:** bundled \`ffmpeg\` / \`ffprobe\` (eugeneware/ffmpeg-static \`b6.1.1\`)
          - **\`cli/\`:** standalone exporter CLIs, WhatsApp \`wtsexporter\` 0.13.0, \`message-reexporter\`, and \`vault-push\`
          - **\`licenses/\`:** project and third-party license notices

          ## Notes

          - Start the desktop app from the archive root: Linux/macOS \`message-vault-io\`, Windows \`message-vault-io.exe\`
          - Builds are unsigned until code-signing secrets are configured (see \`docs/maintainers/signing.md\`). Windows SmartScreen and macOS Gatekeeper may warn on first launch; allow the app once if you trust the download.
          - See \`licenses/THIRD_PARTY_NOTICES.md\` in each archive for bundled helper provenance and licenses."
