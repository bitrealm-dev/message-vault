# Manually cut a semantic-versioned GitHub Release with platform installers
# (.deb, .AppImage, .dmg, .msi).
# Does not run on push/PR — only via Actions → Release → Run workflow.
#
# Version comes from src-tauri/Cargo.toml (single source of truth;
# also shown in the Tauri window title). Bump that field before releasing.
#
# Optional signing (no-op until the matching repo secrets are set):
#   Windows: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGNING_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID,
#            NOTARY_APP_SPECIFIC_PASSWORD
# See docs/maintainers/signing.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: semver
        run: |
          set -euo pipefail
          V="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [[ -z "$V" ]]; then
            echo "version not found in src-tauri/Cargo.toml" >&2
            exit 1
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version from Cargo.toml: ${V@Q} (expected e.g. 0.4.0)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Will release tag v$V (from src-tauri/Cargo.toml)"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_ext: ".deb"
            label: linux-deb
          - os: windows-latest
            bundle_ext: ".msi"
            label: windows-msi
          - os: macos-latest
            bundle_ext: ".dmg"
            label: macos-dmg
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --bundles "${{ matrix.label == 'linux-deb' && 'deb,appimage' || matrix.label == 'windows-msi' && 'msi' || 'dmg' }}"

      - name: Find and rename release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          case "${{ matrix.os }}" in
            ubuntu-latest)
              # Prefer .deb; fall back to .AppImage
              DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" -type f 2>/dev/null | head -1)
              APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -type f 2>/dev/null | head -1)
              if [[ -n "$DEB" ]]; then
                cp "$DEB" "dist/message-vault-io_${VERSION}_amd64.deb"
              elif [[ -n "$APPIMAGE" ]]; then
                cp "$APPIMAGE" "dist/message-vault-io_${VERSION}_amd64.AppImage"
              else
                echo "No Linux bundle found" >&2
                ls -R "$BUNDLE_DIR" || true
                exit 1
              fi
              ;;
            windows-latest)
              MSI=$(find "$BUNDLE_DIR/msi" -name "*.msi" -type f 2>/dev/null | head -1)
              if [[ -n "$MSI" ]]; then
                cp "$MSI" "dist/message-vault-io_${VERSION}_x64.msi"
              else
                echo "No Windows MSI found" >&2
                ls -R "$BUNDLE_DIR" || true
                exit 1
              fi
              ;;
            macos-latest)
              DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -type f 2>/dev/null | head -1)
              if [[ -n "$DMG" ]]; then
                cp "$DMG" "dist/message-vault-io_${VERSION}_aarch64.dmg"
              else
                echo "No macOS DMG found" >&2
                ls -R "$BUNDLE_DIR" || true
                exit 1
              fi
              ;;
          esac

          echo "Artifacts in dist/:"
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: package-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Tauri produces platform installers, not plain archives
          assets=(dist/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release artifacts found under dist/" >&2
            exit 1
          fi
          echo "Release assets:"
          ls -la dist/

          gh release create "$TAG" "${assets[@]}" \
            --title "Message Vault ${VERSION}" \
            --notes "## Highlights

          - Tauri v2 desktop app: web-based UI powered by React + Vite, Rust backend
          - All 7 exporters included: SMS Backup & Restore, iMessage, WhatsApp, GO SMS Pro, iMazing, SMS Backup+, OpenExtract
          - Vault push/pull, format conversion, contacts preview
          - Standalone exporter CLIs: use [message-exporters](https://github.com/bitrealm-dev/message-exporters) releases

          ## Installers

          - \`message-vault-io_${VERSION}_amd64.deb\` — Debian/Ubuntu
          - \`message-vault-io_${VERSION}_amd64.AppImage\` — Linux (portable)
          - \`message-vault-io_${VERSION}_x64.msi\` — Windows
          - \`message-vault-io_${VERSION}_aarch64.dmg\` — macOS (Apple Silicon)

          ## Requirements

          - \`ffmpeg\` / \`ffprobe\` on PATH for media convert/compress features
          - Python 3.11+ for WhatsApp exporter (runs \`wtsexporter\`)

          ## Notes

          - The Tauri app bundles the SPA frontend as static assets — no separate web server needed
          - Builds are unsigned until code-signing secrets are configured (see \`docs/maintainers/signing.md\`). Windows SmartScreen and macOS Gatekeeper may warn on first launch; allow the app once if you trust the download."
