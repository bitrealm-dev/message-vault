name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mbeisser1/message-vault
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build stamp
        id: stamp
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build_id=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_id=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "build_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ steps.stamp.outputs.build_id }}
            BUILD_DATE=${{ steps.stamp.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
