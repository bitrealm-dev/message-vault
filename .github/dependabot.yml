version: 2
updates:
  # Rust workspace (all crates in Cargo.toml members)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # quick-xml cannot move. It is held at 0.39.4 by
      # imessage-database =4.2.0 -> plist =1.9.0, so a bump here only produces
      # a pull request that fails to build — #350 did exactly that, failing
      # all three Rust jobs. The two advisories on that chain are ignored
      # deliberately in deny.toml, with the same reasoning and the same exit
      # condition.
      #
      # Remove this entry when imessage-database releases a version that
      # allows a newer plist, and drop the matching deny.toml ignores at the
      # same time.
      - dependency-name: quick-xml

  # Tauri desktop app — excluded from the workspace, has its own Cargo.lock
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  # Product web frontend
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly

  # Documentation site
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly

  # web-next/ is intentionally excluded: legacy Next.js browse UI, not in CI
  # and not served. Re-add it here if that tree is ever revived.

  # CI workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
