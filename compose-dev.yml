# Dev — laptop day-to-day work.
# Bind-mounts the repo for hot reload; heavier toolchain image.
#
#   docker compose -f compose-dev.yml up
#   docker compose -f compose-dev.yml up --build   # Dockerfile.dev / OS deps changed
#
# With COMPOSE_FILE=compose-dev.yml in .env (default), bare `docker compose up` works.
#
# Blank vault (no demo seed): DEMO_DATA=false docker compose -f compose-dev.yml up
# Staging drop: copy JSONL into ./staging (mounted at /app/staging).
#
# This image builds no frontend. Run Vite on the host (cd web && npm run dev,
# port 5173, proxies /v1 here), or to browse the built UI at :8080 instead run
# ./scripts/build-static.sh (or ln -s web/dist static).
#
# SQLite browser (plain HTTP on loopback): http://127.0.0.1:8081
#
# TLS / nginx for production lives in the private message-vault-ops repo.

services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      DEMO_DATA: ${DEMO_DATA:-true}
      VAULT_AUTH: ${VAULT_AUTH:-local}
      HANKO_API_URL: ${HANKO_API_URL:-}
    volumes:
      - .:/app
      - ./staging:/app/staging
      # Host ./data (not a named volume) so web-next and the vault share
      # the same per-account layout: data/<account_id>/<source_id>/assets.
      - ./data:/app/data
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    stdin_open: true
    tty: true

  # SQLite browser — localhost only.
  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/data
    command: /data/vault.db
    restart: unless-stopped

volumes:
  cargo-target:
  cargo-registry:
