# Dev — laptop day-to-day work.
# Bind-mounts the repo for hot reload; heavier toolchain image.
#
#   docker compose -f compose-dev.yml up
#   docker compose -f compose-dev.yml up --build   # Dockerfile.dev / OS deps changed
#
# With COMPOSE_FILE=compose-dev.yml in .env (default), bare `docker compose up` works.
#
# Personal vault: VAULT_MODE=personal docker compose -f compose-dev.yml up
# Staging drop: copy JSONL into ./staging (mounted at /app/staging).

services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "0.0.0.0:3000:3000"
      - "0.0.0.0:8080:8080"
    environment:
      VAULT_MODE: ${VAULT_MODE:-demo}
      VAULT_AUTH: ${VAULT_AUTH:-local}
      HANKO_API_URL: ${HANKO_API_URL:-${NEXT_PUBLIC_HANKO_API_URL:-}}
      NEXT_PUBLIC_HANKO_API_URL: ${NEXT_PUBLIC_HANKO_API_URL:-}
      NODE_ENV: development
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    volumes:
      - .:/app
      - ./staging:/app/staging
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
      - web-node-modules:/app/web/node_modules
      - vault-data:/app/data
    networks:
      default:
        aliases:
          - vault-backend
    stdin_open: true
    tty: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - vault
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/ssl/cloudflare/bitrealm.dev.pem:/etc/nginx/certs/bitrealm.dev.pem:ro
      - /etc/ssl/cloudflare/bitrealm.dev.key:/etc/nginx/certs/bitrealm.dev.key:ro
    restart: unless-stopped

volumes:
  cargo-target:
  cargo-registry:
  web-node-modules:
  vault-data:
