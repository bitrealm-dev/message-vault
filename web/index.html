<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Vault</title>
    <script>
      (function () {
        try {
          var mk = "mv-theme";
          var sk = "mv-theme-seeds";
          var defH = "#222426";
          var defA = "#5ea1ff";
          var defLH = "#e6e9ee";
          var defLA = "#2b7fff";
          var mode = localStorage.getItem(mk);
          if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var seeds = null;
          try {
            var raw = localStorage.getItem(sk);
            if (raw) {
              if (raw.charAt(0) === "{") {
                seeds = JSON.parse(raw);
              } else {
                var p = raw.split(/[,\s]+/).filter(Boolean);
                if (p.length === 4)
                  seeds = {
                    lightHeader: p[0],
                    lightAccent: p[1],
                    darkHeader: p[2],
                    darkAccent: p[3],
                  };
              }
            }
          } catch (e) {}
          var h = dark
            ? (seeds && seeds.darkHeader) || defH
            : (seeds && seeds.lightHeader) || defLH;
          var a = dark
            ? (seeds && seeds.darkAccent) || defA
            : (seeds && seeds.lightAccent) || defLA;
          var r = document.documentElement;
          r.setAttribute("data-theme", dark ? "dark" : "light");
          r.style.setProperty("--header", h);
          r.style.setProperty("--accent", a);
        } catch (e) {
          var r2 = document.documentElement;
          r2.setAttribute("data-theme", "dark");
          r2.style.setProperty("--header", "#222426");
          r2.style.setProperty("--accent", "#5ea1ff");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
