[workspace]
resolver = "2"
members = [
    ".",
    "crates/demo-seed",
]

[workspace.dependencies]
message-ir = { git = "https://github.com/bitrealm-dev/message-exporters", package = "message-ir" }
contacts = { git = "https://github.com/bitrealm-dev/message-exporters", package = "contacts" }
phone = { git = "https://github.com/bitrealm-dev/message-exporters", package = "phone" }

[package]
name = "message-vault-rs"
version = "0.2.2"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
contacts = { workspace = true }
demo-seed = { path = "crates/demo-seed" }
futures-util = { version = "0.3.31", default-features = false }
message-ir = { workspace = true }
phone = { workspace = true }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["limit"] }
