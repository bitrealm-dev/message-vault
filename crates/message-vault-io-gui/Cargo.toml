[package]
name = "message-vault-io-gui"
version = "0.5.0"
edition = "2024"
description = "Slint desktop GUI for message-vault-io"
build = "build.rs"


[[bin]]
name = "message-vault-io"
path = "src/main.rs"

[dependencies]
chrono = "0.4.44"
slint = "1.17"
rfd = "0.15"
open = "5"

go-sms-pro-exporter = { path = "../exporters/go-sms-pro-exporter", default-features = false }
imazing-exporter = { path = "../exporters/imazing-exporter", default-features = false }
imessage-ir-exporter = { path = "../exporters/imessage-ir-exporter", default-features = false }
openextract-exporter = { path = "../exporters/openextract-exporter", default-features = false }
sms-backup-plus-exporter = { path = "../exporters/sms-backup-plus-exporter", default-features = false }
sms-backup-restore-exporter = { path = "../exporters/sms-backup-restore-exporter", default-features = false }
whatsapp-exporter = { path = "../exporters/whatsapp-exporter", default-features = false }
contacts = { path = "../message/contacts" }
message-vault-io-core = { path = "../message-vault-io-core" }
message-reexport = { path = "../message/reexport" }
media = { path = "../message/media" }
phone = { path = "../message/phone" }
vault-push = { path = "../vault-push", default-features = false }

[build-dependencies]
slint-build = "1.17"
