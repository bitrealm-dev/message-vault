[package]
name = "vault-push"
version = "0.1.0"
edition = "2024"
description = "Push message-ir JSONL exports into a Message Vault import API"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = "1.0.103"
hex = "0.4.3"
jsonl_journal = { package = "journal", path = "../../libs/journal" }
vault-http = { path = "../../libs/vault-http" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
media = { path = "../media" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
vault-api-types = { version = "0.1.0", path = "../vault-api-types" }

[dev-dependencies]
tempfile = "3.27.0"
httpmock = "0.8"
