[package]
name = "message-ir-format"
version = "0.1.0"
edition = "2024"
description = "FormatSink, readers/writers, and transforms for message-ir ConversationDocument"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = "1.0.103"
csv = "1.4.0"
hex = "0.4"
sha2 = "0.11"
message-csv = { path = "../csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../ir" }
mail = { path = "../mail" }
media = { path = "../media" }
obfuscate = { path = "../obfuscate" }
phone = { path = "../phone" }
sbr = { path = "../sbr" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
message-ir = { path = "../ir", features = ["testutil"] }
tempfile = "3.27.0"
