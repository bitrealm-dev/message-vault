[package]
name = "imessage-ir-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Export iMessage data to per-conversation CSV / EML / MBOX / JSON via message-ir"
repository = "https://github.com/bitrealm-io/message-vault"

[lib]
name = "imessage_ir_exporter"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "message-vault-io-core/cli"]

[[bin]]
name = "imessage-ir-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4", features = ["derive"], optional = true }
crabapple = { version = "=0.4.7" }
hex = "0.4.3"
imessage-database = "4.2.0"
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
mail = { path = "../../libs/mail" }
rpassword = "=7.5.4"
rusqlite = { version = "=0.40.0", features = ["blob", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
