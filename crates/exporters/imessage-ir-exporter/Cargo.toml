[package]
name = "imessage-ir-exporter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Export iMessage data to per-conversation CSV / EML / MBOX / JSON via message-ir"
repository = "https://github.com/bitrealm-dev/message-vault-io"

[lib]
name = "imessage_ir_exporter"
path = "src/lib.rs"

[[bin]]
name = "imessage-ir-exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
crabapple = { version = "=0.4.7" }
hex = "0.4.3"
imessage-database = "4.2.0"
message-csv = { path = "../../message/csv" }
message-vault-io-core = { path = "../../message-vault-io-core" }
message-ir = { path = "../../message/ir" }
message-ir-format = { path = "../../message/ir-format" }
mail = { path = "../../message/mail" }
rpassword = "=7.5.3"
rusqlite = { version = "=0.40.0", features = ["blob", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
