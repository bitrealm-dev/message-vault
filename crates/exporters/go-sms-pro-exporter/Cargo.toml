[package]
name = "go-sms-pro-exporter"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap", "message-vault-io-core/cli"]

[[bin]]
name = "go-sms-pro-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
hex = "0.4.3"
obfuscate = { path = "../../message/obfuscate" }
contacts = { path = "../../message/contacts" }
go-sms-mms = { path = "../../message/go-sms-mms" }
message-csv = { path = "../../message/csv" }
message-vault-io-core = { path = "../../message-vault-io-core" }
message-ir = { path = "../../message/ir" }
message-ir-format = { path = "../../message/ir-format" }
media = { path = "../../message/media" }
phone = { path = "../../message/phone" }
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
