[package]
name = "openextract-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert OpenExtract conversation CSV (+ VCF) to shared per-chat CSV"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap", "message-vault-io-core/cli"]

[[bin]]
name = "openextract-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
obfuscate = { path = "../../libs/obfuscate" }
contacts = { path = "../../libs/contacts" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
