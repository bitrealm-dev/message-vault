[package]
name = "imazing-exporter"
version = "0.1.0"
edition = "2024"
description = "Convert iMazing Messages / WhatsApp CSV (+ vCard CSV / VCF contacts) to shared per-chat CSV"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap", "message-vault-io-core/cli"]

[[bin]]
name = "imazing-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
hex = "0.4.3"
obfuscate = { path = "../../libs/obfuscate" }
contacts = { path = "../../libs/contacts" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
