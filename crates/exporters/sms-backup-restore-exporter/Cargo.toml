[package]
name = "sms-backup-restore-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "sms-backup-restore-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
contacts = { path = "../../libs/contacts" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core", features = ["cli"] }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
serde_json = "1.0.150"

[dev-dependencies]
message-vault-io-core = { path = "../../core/message-vault-io-core", features = ["testutil"] }
tempfile = "3.27.0"
