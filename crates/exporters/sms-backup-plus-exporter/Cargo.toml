[package]
name = "sms-backup-plus-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
autotests = false

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
csv = "1.4.0"
hex = "0.4.3"
mailparse = "0.16.1"
contacts = { path = "../../libs/contacts" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
rayon = "1.12.0"
regex = "1.13.0"
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
message-vault-io-core = { path = "../../core/message-vault-io-core", features = ["testutil"] }
tempfile = "3.27.0"
