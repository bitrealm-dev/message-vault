[package]
name = "whatsapp-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert WhatsApp DB/backup via wtsexporter JSON to shared per-chat CSV"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap", "message-vault-io-core/cli"]

[[bin]]
name = "whatsapp-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
hex = "0.4.3"
obfuscate = { path = "../../libs/obfuscate" }
message-csv = { path = "../../libs/csv" }
message-vault-io-core = { path = "../../core/message-vault-io-core", features = ["cli"] }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
