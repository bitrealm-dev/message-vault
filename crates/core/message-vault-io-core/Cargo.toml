[package]
name = "message-vault-io-core"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Shared export pipeline, jobs, and form model for the Message Vault desktop app and CLIs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.5", features = ["derive"], optional = true }
contacts = { path = "../../libs/contacts", optional = true }
message-csv = { path = "../../libs/csv" }
message-ir = { path = "../../libs/ir" }
media = { path = "../../libs/media" }
sha2 = "0.11.0"
tempfile = { version = "3.27.0", optional = true }

[features]
cli = ["dep:clap"]
testutil = ["dep:tempfile", "dep:contacts"]

[dev-dependencies]
tempfile = "3.27.0"
