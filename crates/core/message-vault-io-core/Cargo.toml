[package]
name = "message-vault-io-core"
version = "0.1.0"
edition = "2024"
description = "Shared form models and process spawning for message-vault-io GUIs"

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
message-csv = { path = "../message/csv" }
media = { path = "../message/media" }
rust-ini = "0.21"

[features]
cli = ["dep:clap"]

[dev-dependencies]
tempfile = "3.27.0"
