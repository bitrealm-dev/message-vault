[package]
name = "vault-push"
version = "0.1.0"
edition = "2024"
description = "Push message-ir JSONL exports into a Message Vault import API"
license = "AGPL-3.0-only"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "vault-push"
path = "src/bin/vault_push.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
hex = "0.4.3"
message-vault-io-core = { path = "../../core/message-vault-io-core" }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
httpmock = "0.7"
