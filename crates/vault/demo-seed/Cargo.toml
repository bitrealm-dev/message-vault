[package]
name = "demo-seed"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "demo_seed"
path = "src/lib.rs"

[[bin]]
name = "demo-seed"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
message-ir = { workspace = true }
sha2 = "0.11.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_distr = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3.27.0"
