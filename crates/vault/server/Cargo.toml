[package]
name = "message-vault-server"
version = "0.8.3"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
contacts = { workspace = true }
demo-seed = { path = "../demo-seed" }
fs2 = "0.4.3"
futures-util = { version = "0.3.31", default-features = false }
libc = "0.2"
message-ir = { workspace = true }
message-ir-format = { path = "../../libs/ir-format" }
phone = { workspace = true }
rand = "0.10.2"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "tls-rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["limit", "cors", "fs"] }
uuid = { version = "1.18.1", features = ["v4"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
reqwest = { version = "0.12.25", default-features = false, features = ["rustls-tls", "json"] }
